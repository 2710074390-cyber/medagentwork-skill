# MedAgentWork Pipeline Configuration v2.0
# ==========================================
# 5-Agent 管线声明式配置 — 单一事实来源。
# 所有阈值、Schema、门禁规则集中于此，
# 替代 SOUL.md + Prompt 中分散的约束声明。
#
# ⚠️ skill 分享版路径约定（2026-09）:
#   - 本文件为声明式规范文档：阶段/门禁/SLO/阈值的单一事实来源
#   - 其中 command 字段为逻辑命令；实际执行时脚本位于本 skill 的 scripts/ 目录，
#     即 `cd <你的工作区> && python <技能目录>/scripts/validate_options.py --batch {batch_id}`
#   - subjects 段（如保留）为文档速查；RAG 参数唯一事实源随 知识库素材/ 缩减已不适用，
#     检索增强由宿主 agent 自行接入
#
# 设计参考: GitLab CI / Jenkinsfile / Argo Workflows
# 核心理念: Pipeline as Code — 管线定义即执行规范

pipeline:
  name: "MedAgentWork 5-Agent 题库生产管线"
  version: "2.1.0"
  created: "2026-06-24"

# ═══════════════════════════════════════════════════════════
# 阈值段 — 规则层与门禁层的「运行时单一事实来源」
# ═══════════════════════════════════════════════════════════
# v2.1 变更（评审 §6.4「风险」/ §七.7）：
#   此前本文件声明 option_avg_max / bloom 阈值，但 rules_numeric.py、
#   rules_structural.py、gate_check.py 里的阈值是硬编码的 —— 两边只靠"巧合一致"
#   维持。现由 scripts/pipeline_config.py 在运行时读取本段（缺失回退内置默认，
#   默认值与本段取值一致），改这里即可全局生效。
#
# 写法约束：本段必须保持「扁平 key: 值 / key: [行内列表]」两级以内结构，
#   以便在未安装 PyYAML 的零依赖环境下由内置最小解析器读取。
# ═══════════════════════════════════════════════════════════

thresholds:
  r2_ratio_fail: 2.0              # R2 正确选项/最短干扰项 长度比 ≥ 此值 → FAIL
  r2_ratio_warn: 1.5              # R2 长度比 ≥ 此值 → WARN
  option_length_max: 20           # R13 单选项字数 > 此值 → FAIL
  option_avg_max: 18              # R13 选项平均字数 > 此值 → WARN
  bloom_deviation_max: 15         # Bloom 单层偏差 > 此值(%) → BLOCKED
  bloom_recompute_tolerance: 5    # 门禁独立重算 Bloom 与质检报告自述值的允许偏差(%)
  # R8 短选项豁免词表（评审 §6.5-P1.5 / §七.9）：按科目叠加，替代原精神科硬编码。
  # 题目带 subject 字段，或运行时设 MEDAGENTWORK_SUBJECT 环境变量即可生效。
  r8_legit_terms_default: [妄想, 幻觉, 障碍, 减退, 缺乏, 低落, 焦虑, 恐惧, 躁狂, 抑郁, 木僵, 违拗, 缄默, 痴呆, 谵妄, 强迫, 疑病, 失眠, 嗜睡, 人格, 自知力, PTSD, OCD, AD]
  r8_legit_terms_tcm: [气, 血, 津液, 阴阳, 表里, 寒热, 虚实, 风寒, 风热, 湿热, 痰浊, 瘀血, 气滞, 证, 脉, 舌]
  r8_legit_terms_surgery: [术, 疝, 痔, 瘘, 瘤, 囊肿, 脓肿]
  r8_legit_terms_psychiatry: [妄想, 幻觉, 木僵, 谵妄, PTSD, OCD, AD]

# ═══════════════════════════════════════════════════════════
# Stage 定义 — 每个阶段 = 一个 Agent + 门禁
# ═══════════════════════════════════════════════════════════

stages:
  - id: agent2
    name: "MedGen 内容生产"
    description: "根据教材生成结构化题目 JSON + 备考资料"
    input_dir: "输入素材/"
    output_dir: "中间产物/"
    contract_schema: "schemas/agent2_output.schema.json"
    quality_gates:
      - id: GATE-A2
        type: script
        command: "python validate_options.py --batch {batch_id}"
        pass_condition: "summary.fail == 0"
        on_failure: BLOCK
        auto_fix: false
    slo:
      bloom_memory_max: 35          # 记忆层上限 (%)
      bloom_application_min: 20     # 应用层下限 (%)
      r2_fail_max: 0               # 长度比 FAIL 必须为 0
      r7_fail_max: 0               # 截断 FAIL 必须为 0
      r8_fail_max: 0               # 最小长度 FAIL 必须为 0
      option_avg_min: 6            # 选项平均字数下限
      option_avg_max: 18           # 选项平均字数上限
      answer_bias_max: 15          # 单选项答案集中度上限 (%)
    prompt_constraints:
      subject_short_terms:
        tcm: [中药名, 方剂名, 穴位名, 证型名, 脏腑名, 经络名, 病因, 学说, 治则]
        psychiatry: [药名, 受体名, 量表缩写, 综合征缩写]
        neurology: [解剖结构缩写, 综合征缩写]
        internal_med: [药名缩写, 评分缩写]
        surgery: [术式缩写, 分级缩写]
      option_length:
        min_chars: 4
        max_chars: 18
        ratio_max: 1.5
        natural_short_exempt: true

  - id: agent3
    name: "MedQC 质量守门"
    description: "质检报告 + 门禁裁决"
    input_dir: "中间产物/"
    output_dir: "质检报告/"
    prerequisites: [agent2]
    contract_schema: "schemas/agent3_output.schema.json"
    quality_gates:
      - id: GATE-A3-D20
        type: conditional
        pass_condition: "D20_score != 0"
        on_failure: BLOCK
        can_override: false
      - id: GATE-A3-BLOOM
        type: threshold
        field: "bloom_max_deviation"
        threshold: 15              # Bloom 偏差 > 15% → BLOCKED
        on_failure: BLOCK
        can_override: false
    slo:
      overall_score_min: 70        # 质检总分下限
      critical_issues_max: 5       # Critical 问题上限
      major_issues_max: 20         # Major 问题上限
      bloom_deviation_max: 15      # Bloom 单层偏差上限 (%)
      answer_bias_max: 20          # 答案位置集中度上限 (%)
      must_escalate_max: 5         # 必须升项问题数上限
    checks:
      - D5: "答案溯源验证"
      - D6: "否定词加粗检查"
      - D7: "选项重复检测"
      - D10: "难度分布检查"
      - D11: "干扰项 plausibility 逐项评分"
      - D12: "页码标注完整性"
      - D13: "术语一致性"
      - D14: "教材引用准确性"
      - D15: "外来素材事实验证 (条件触发)"
      - D16: "Bloom 认知层级覆盖率"
      - D17: "选项同质性 (类别/语法/长度/绝对化/括号后缀/视觉突出/题干词移动)"
      - D18: "词重复线索 (NBME) → 已代码化 R10"
      - D19: "收敛策略 (NBME) → 已代码化 R11"
      - D20: "B1 型题专项检查"

  - id: agent4
    name: "MedFix 交付修正"
    description: "根据质检报告修复文件 + 追溯日志"
    input_dir: "中间产物/"
    output_dir: "最终产物/"
    prerequisites: [agent3]
    contract_schema: "schemas/agent4_output.schema.json"
    quality_gates:
      - id: GATE-A4-TRACE
        type: file_exists
        pattern: "*追溯日志*.json"
        on_failure: BLOCK
      - id: GATE-A4-HC13
        type: field_check
        field: "source_file_synced"
        pass_condition: "== true"
        on_failure: BLOCK
        can_override: false
      - id: GATE-A4-JSON
        type: content_check
        check: "no_yaml_frontmatter"
        on_failure: BLOCK
        auto_fix: true               # 可自动剥离 YAML 前置
      - id: GATE-A4-RERUN
        type: script
        command: "python validate_options.py --batch {batch_id}_FIXED"
        pass_condition: "summary.fail == 0"
        on_failure: BLOCK
    slo:
      polarity_violations_max: 0    # 极性违规 (错误改对/对改错)
      rollbacks_max: 0              # 回滚次数
      escalations_max: 3            # 升项上限
      hc6_issues_max: 3             # HC-6 独立审查问题上限
    constraints:
      - id: HC-6-RESTORE
        rule: "禁止暴力截断; 禁止 '(相关表现)' '(相关类型)' 无意义后缀"
        check: "R12 in validate_options.py"
      - id: HC-7-CONSISTENCY
        rule: "修改后全局一致性扫描 — 使用 diff 对比修复前后所有字段"
        check: "可代码化: R14 (待实现)"
      - id: HC-13-SOURCE
        rule: "修复 COMPLETE.json 必须同步修改分系统源文件"
        check: "GATE-A4-HC13"

  - id: agent5
    name: "MedReview 主复习资料"
    description: "综合素材生成教材浓缩型分层复习手册"
    input_dir: "最终产物/"
    output_dir: "复习资料/"
    prerequisites: [agent4]
    # contract: 复习资料为 MD 文档，无 JSON Schema；
    # 契约 = Prompt版本/Agent5_MedReview_Prompt.md 的附录要求 + verify_page_numbers.py (HC-9/10/11)
    contract_schema: null
    quality_gates:
      - id: GATE-FINAL-HC9
        type: content_check
        field: "hc9_terminology_appendix"
        pass_condition: "exists and non_empty"
        on_failure: BLOCK
      - id: GATE-FINAL-HC10
        type: content_check
        field: "hc10_page_authenticity"
        pass_condition: "contains 'OK' and not contains 'placeholder'"
        on_failure: BLOCK
      - id: GATE-FINAL-HC11
        type: content_check
        field: "hc11_outline_page_marking"
        pass_condition: "contains 'OK' or contains '0 missing'"
        on_failure: BLOCK
      - id: GATE-FINAL-JSON
        type: content_check
        field: "json_valid"
        pass_condition: "== true"
        on_failure: BLOCK
    slo:
      hc9_entry_count_min: 20       # 术语附录最少条目
      hc10_page_dispersion_min: 10  # 页码分散度 (不同页码数)
      hc10_no_placeholder: true     # 禁止占位符页码
      hc11_coverage_min: 90         # 大纲页码标注覆盖率 (%)
      visual_v1_v8_all_pass: true   # 视觉质量自检 8 项

# ═══════════════════════════════════════════════════════════
# 全局 SLO (Service Level Objectives)
# ═══════════════════════════════════════════════════════════

global_slo:
  bloom_target: {记忆: 30, 理解: 40, 应用: 25, 分析: 5}
  bloom_tolerance: 10              # 允许偏差 (%)
  validate_fail_max: 0             # 最终产物 FAIL 必须为 0
  gate_bypass_count: 0             # 门禁绕过事件 (目标: 0)
  regression_rate: 0               # 已修复问题回归率 (目标: 0)
  mean_time_to_recovery: 30        # MTTR 目标 (分钟)

# ═══════════════════════════════════════════════════════════
# 学科特性配置 (Feature Flags)
# ═══════════════════════════════════════════════════════════
# v2.1 清理（评审 §6.5-P2.6）：原 subjects 段携带 chunk_size / top_n /
#   hybrid_search / keyword_weight 等 RAG 参数，但该 RAG 机制（知识库素材/search_kb.py）
#   未随 skill 分发，属原项目遗留声明，容易误导使用者 —— 已移除。
#   保留的 short_term_categories / option_length_ratio / protect_rules 是出题提示词
#   实际会用到的学科特性；short_term_categories 同时驱动 thresholds.r8_legit_terms_*。
subjects:
  internal-med:
    protect_rules:
      - "风险评分量表不拆分"
      - "诊断分类标准不拆分"
    short_term_categories: [药名缩写, 评分缩写]
    option_length_ratio: 1.5

  surgery:
    protect_rules:
      - "手术步骤顺序保护"
      - "分期分型/TNM不拆分"
    short_term_categories: [术式缩写, 分级缩写]
    option_length_ratio: 1.5

  neurology:
    protect_rules:
      - "综合征不拆分"
      - "传导通路不拆分"
      - "分型标准不拆分"
    short_term_categories: [解剖结构缩写, 综合征缩写]
    option_length_ratio: 1.5

  psychiatry:
    protect_rules:
      - "DSM/ICD诊断条目不拆分"
      - "评定量表不拆分"
    short_term_categories: [药名, 受体名, 量表缩写, 综合征缩写]
    option_length_ratio: 1.7

  pediatrics:
    protect_rules:
      - "年龄正常值不拆分"
      - "发育里程碑不拆分"
      - "按体重剂量不拆分"
    short_term_categories: [发育缩写, 评分缩写]
    option_length_ratio: 1.5

  tcm:
    protect_rules:
      - "每方独立chunk"
      - "每药独立chunk"
      - "每穴独立chunk"
    short_term_categories: [中药名, 方剂名, 穴位名, 证型名, 脏腑名, 经络名, 病因, 学说, 治则]
    option_length_ratio: 2.0        # 中医放宽: 脏腑1字 vs 方剂名7字

  dermatology:
    protect_rules:
      - "皮损形态+分布三联组不拆分"
    short_term_categories: [药名缩写, 皮疹类型缩写]
    option_length_ratio: 1.5

  doctor-patient:
    protect_rules:
      - "法律条文不拆分"
      - "沟通模型步骤不拆分"
    short_term_categories: []
    option_length_ratio: 1.5

  tcm-psychology:
    protect_rules:
      - "证型辨证论治不拆分"
      - "情志相胜配对不对拆分"
    short_term_categories: [证型名, 疗法名, 穴位名, 脏腑名]
    option_length_ratio: 2.0

# ═══════════════════════════════════════════════════════════
# 故障处置（Runbook）
# ═══════════════════════════════════════════════════════════
# v2.1 清理（评审 §6.5-P2.6）：原 runbook.patterns 引用的 healthcheck.py /
#   runbook.py / maintenance.py / sync_tools.py 均属原项目跨工作区运维脚本，
#   未随 skill 分发 —— 已移除，避免"声明了但跑不起来"。
#   skill 版保留的故障处置语义如下（全部由已分发脚本实现）。
runbook:
  severities:
    P0_BLOCK: [GATE-A2, GATE-A3, GATE-A4]   # 阻断管线，必须修复后重跑
    P1_WARN: []                             # skill 版无自动修复项，见下方处置说明
    P2_INFO: []
  handling:
    - symptom: "GATE-A2 BLOCKED (validate FAIL > 0)"
      detection: "gate_check.py --stage agent2_done"
      auto_fix: false
      action: "回退 MedGen 修正题库 JSON 后重跑 validate_options.py，再跑 gate_check.py --clear-halt"
    - symptom: "GATE-A3 BLOCKED (D20=0 / Bloom 偏差超限 / Bloom 自述与重算不一致)"
      detection: "gate_check.py --stage agent3_done"
      auto_fix: false
      action: "回退 MedQC 复核质检报告，或回退 MedGen 重构题目结构"
    - symptom: "GATE-A4 BLOCKED (source_file_synced != true / 复检 FAIL > 0)"
      detection: "gate_check.py --stage agent4_done"
      auto_fix: false
      action: "回退 MedFix 补齐追溯日志与源文件同步后重跑"
    - symptom: "GATE-FINAL BLOCKED (HC-9/10/11 或 JSON 完整性)"
      detection: "gate_check.py --stage final"
      auto_fix: false
      action: "回退 MedReview 修正术语附录/页码标注后重跑"
    - symptom: "workflow_state 缺少 AGENT3/AGENT4 步骤记录"
      detection: "gate_check.py fail-closed 分支"
      auto_fix: false
      action: "由 MedMaster 按 references/runbook.md 用 workflow_state.py 补写步骤块（禁手改 JSON，HC-17）"

# ═══════════════════════════════════════════════════════════
# 组卷公式 (Paper Assembly) — 【本 skill 版不包含】
# ═══════════════════════════════════════════════════════════
# v2.1 清理（评审 §6.5-P2.6）：原段声明的 scripts/paper_builder.py 及
#   question_bank/calibrated_difficulty*.jsonl 难度校准数据均未随 skill 分发，
#   且依赖用户自备的真题数据。此处仅保留设计说明，供需要者自行实现。
paper_assembly:
  distributed: false
  note: "组卷器（paper_builder.py）与难度校准数据未随 skill 分发；如需组卷请自行实现，或直接使用 render_qbank_html.py 输出题库 HTML。"
  design_reference:
    formula: "考频权重(blueprint) × 难度配平(calibrated_p) × NFD 过滤"
    targets:
      paper_p: [0.55, 0.65]
      answer_balance: "A/B/C/D 贪心纠偏，目标均匀 ≤25%±5%"
    type_weights: {A1: 0.40, A2: 0.25, A3: 0.15, B1: 0.10, X: 0.10}

# ═══════════════════════════════════════════════════════════
# 可观测性 (Observability)
# ═══════════════════════════════════════════════════════════

observability:
  metrics:
    - name: validate_score_trend
      description: "每批次 validate PASS/WARN/FAIL 趋势"
      source: "validate_options_report_*.json"
    - name: bloom_distribution
      description: "每批次 Bloom 四层分布"
      source: "workflow_state.json"
    - name: option_length_trend
      description: "每批次选项平均字数走势"
      source: "validate_options_report_*.json"
    - name: gate_pass_rate
      description: "门禁通过率 (每阶段)"
      source: "workflow_state.json.gate_results"
    - name: regression_rate
      description: "已修复问题回归率"
      source: "regression_db.json"

  alert_rules:
    - name: bloom_memory_creeping
      condition: "连续 2 批次 Bloom 记忆层上升且均 > 35%"
      action: "通知用户 + 建议检查 Agent 2 Prompt"
    - name: validate_fail_increasing
      condition: "FAIL 数环比增长 > 50%"
      action: "通知用户 + 检查最近 Prompt 变更"
    - name: gate_bypass_detected
      condition: "gate_results 显示 PASS 但实际未运行检查脚本"
      action: "自动运行 gate_check.py 复核 + 通知用户"
    - name: option_length_oscillation
      condition: "连续 2 批次选项 avg 波动 > 50%"
      action: "通知用户 + 建议参数化约束校准"
