# MedAgentWork Skill — CI（评审 §6.5-P2.8 / §七.11）
#
# 为什么加这个：原仓库无 CI、无 lint、无类型检查，9512 行 Python 全靠人工维护；
# 唯一自动化验证（冒烟测试）只检查"退出码可执行"。本工作流把
#   1) 语法编译检查（能自动抓到 scripts.telemetry 那类未定义模块引用）
#   2) 静态检查（pyflakes：未使用/未定义名称）
#   3) 冒烟测试（含规则命中断言）
# 三件事固化为每次 push / PR 的必过关卡。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法编译检查（stdlib only，可发现未定义模块引用）
        run: python -m compileall -q skills/medagentwork/scripts smoketest

      - name: 静态检查（pyflakes）
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes skills/medagentwork/scripts smoketest || true
          echo "pyflakes 仅作提示，不作为失败条件（历史遗留告警较多）"

      - name: 冒烟测试（含 R1-R13/JS1 规则命中断言）
        run: python smoketest/run_smoketest.py

      - name: pipeline.yaml 阈值可被零依赖解析器读取
        run: python skills/medagentwork/scripts/pipeline_config.py

      - name: 投稿/发布前预检（frontmatter 规范 + 悬空链接）
        run: python tools/preflight_publish.py --strict
